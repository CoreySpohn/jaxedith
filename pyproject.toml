[build-system]
requires = ['hatchling>=1.27.0', "hatch-fancy-pypi-readme>=23.1.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "jaxedith"
description = "JAX based HWO exposure time calculator"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "equinox>=0.13.2",
    "hwoutils>=1.10",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "jaxtyping>=0.3.3",
    "skyscapes>=2.0",
    "zodi>=1.1.0",
]
[project.optional-dependencies]
dev = ["pre-commit>=3.6.0"]
docs = [
    "sphinx>=7.2.6",
    "myst-nb>=1.0.0",
    "sphinx-book-theme>=1.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "ipython>=8.18.1",
    "matplotlib>=3.10.8",
]
test = [
    "pytest>=7.3.2",
    "beartype>=0.20.1",
    "hypothesis>=6.112.1",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "numpy>=2.1.2",
    "scipy>=1.13",
    "orbix>=2.0",
    "optixstuff>3.0.0",
    "skyscapes>=2.0",
    "yippy>=2.11.0",
    "coronalyze>=1.1.1",
    "coronagraphoto>=4.1",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/jaxedith"
Issues = "https://github.com/CoreySpohn/jaxedith/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jaxedith/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures don't need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxedith"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # ExoJAX's HITRAN adapter redirects stdout without closing its devnull file.
    'ignore:unclosed file .*dev/null.*:ResourceWarning:exojax\.database\._common\.hitranapi$',
    # HITRAN HAPI's regex strings contain invalid escapes on Python 3.12.
    "ignore:invalid escape sequence:SyntaxWarning:.*/hapi/hapi$",
    # ExoJAX's isotope table separator uses a non-raw regex string.
    "ignore:invalid escape sequence:SyntaxWarning:.*/exojax/utils/isotopes$",
    # Vaex's string-function docstrings contain non-raw regex examples.
    "ignore:invalid escape sequence:SyntaxWarning:.*/vaex/functions$",
    # Vaex's plotting parser uses non-raw regex strings.
    "ignore:invalid escape sequence:SyntaxWarning:.*/vaex/viz/(mpl|contour)$",
    # ExoJAX's line-shape docstrings contain non-raw LaTeX escapes.
    "ignore:invalid escape sequence:SyntaxWarning:.*/exojax/opacity/_common/lsd$",
    # ExoJAX's atomic-broadening and Mie docstrings contain non-raw LaTeX escapes.
    "ignore:invalid escape sequence:SyntaxWarning:.*/exojax/database/(core_atom/broadening|mie)$",
    # ExoJAX's atmospheric-profile docstrings contain non-raw LaTeX escapes.
    "ignore:invalid escape sequence:SyntaxWarning:.*/exojax/atm/atmprof$",
    # ExoJAX's two-stream transfer docstrings contain non-raw LaTeX escapes.
    "ignore:invalid escape sequence:SyntaxWarning:.*/exojax/rt/(toon|twostream)$",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "jaxedith"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["jaxedith"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
# skyscapes supplies the System and scene types the *_from_system wrappers accept
# (duck-typed, so no import in src).
DEP002 = ["jaxlib", "skyscapes"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/jaxedith"]

[tool.ty.rules]
# Equinox abstract fields and metaclasses are not fully modeled yet.
invalid-attribute-override = "ignore"
invalid-property-type-override = "ignore"
invalid-argument-type = "warn"
invalid-return-type = "warn"
